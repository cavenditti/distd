syntax = "proto3";
package distd;

service Distd {
  rpc Register(ClientRegister) returns (ServerMetadata);
  rpc Fetch(ClientKeepAlive) returns (ServerMetadata);
  // Legacy RPCs — kept for backward compatibility during transition
  rpc AdvHashes(Hashes) returns (Acknowledge);
  rpc TreeTransfer(ItemRequest) returns (stream SerializedTree);
  // PPSPP-style bidirectional sync
  rpc Sync(stream SyncMessage) returns (stream SyncMessage);
}

// ─── PPSPP Sync messages ────────────────────────────────────────────────────

message SyncMessage {
  oneof msg {
    ManifestRequest manifest_request = 1;
    ManifestResponse manifest_response = 2;
    PossessionBitfield possession = 3;
    ChunkRequest chunk_request = 4;
    ChunkData chunk_data = 5;
    BulkData bulk_data = 6;
  }
}

message ManifestRequest {
  string artifact_id = 1;
  optional uint64 version = 2; // if absent, latest
}

message ManifestResponse {
  string artifact_id = 1;
  uint64 version = 2;
  bytes root_hash = 3;
  uint64 total_size = 4;
  uint32 chunk_count = 5;
  uint32 chunk_size = 6;
  // Ordered leaf hashes so client can build its bitfield
  repeated bytes chunk_hashes = 7;
}

message PossessionBitfield {
  bytes bitfield = 1; // serialized Bitfield (4-byte count LE + packed bits)
}

message ChunkRequest {
  repeated uint32 indices = 1;
}

message ChunkData {
  uint32 chunk_index = 1;
  bytes data = 2;
}

// Bulk fast-path: concatenated chunks with minimal framing (Step 7)
message BulkData {
  bytes data = 1;
  uint32 start_index = 2;
  uint32 count = 3;
}

// ─── Legacy messages ────────────────────────────────────────────────────────

message Hashes { repeated bytes hashes = 1; }

message ItemRequest {
  string artifact_id = 1; // Stable artifact identity
  reserved 2; //bytes item_root = 2; // root hash of the item
  optional uint32 request_version = 3; // if not specified latest is returned
  optional uint32 from_version = 4;
  optional Hashes hashes = 5;
}

message SerializedTree { bytes payload = 1; }

message Acknowledge { EnumAcknowledge ack = 1; }

message ClientKeepAlive {}

message ServerMetadata {
  bytes serialized = 1;    // yet to be defined
  optional bytes uuid = 2; // Returned only on client registration
}

message ClientRegister {
  string name = 1;
  string version = 2;
  optional bytes uuid = 3;
}

enum EnumAcknowledge {
  // option allow_alias = true;
  ACK_UNSPECIFIED = 0;
  ACK_OK = 1;
  ACK_CONFUSED = 2; // Something wrong, provided invalid hash maybe?
  ACK_IGNORED = 3;  // Request well formed but will be ignored (item didn't
                    // change from last hashes maybe)
}
