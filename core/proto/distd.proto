syntax = "proto3";
package distd;

// Protobuf contract V1 is declared by the fixed DSWP operation preface.
// Field numbers, oneof tags, and enum values are never reused. A removed
// identifier must be reserved here by both number and name. Enum zero values
// remain unspecified/error sentinels. Additive fields are V1-compatible only
// when an older reader may safely ignore their complete semantics; otherwise
// the protobuf-contract version in the operation preface must be incremented.

service Distd {
  rpc Register(ClientRegister) returns (ServerMetadata);
  rpc Fetch(ClientKeepAlive) returns (ServerMetadata);
  // PPSPP-style bidirectional sync
  rpc Sync(stream SyncMessage) returns (stream SyncMessage);
}

enum PayloadCompression {
  PAYLOAD_COMPRESSION_UNSPECIFIED = 0;
  PAYLOAD_COMPRESSION_ZSTD = 1;
}

// ─── PPSPP Sync messages ────────────────────────────────────────────────────

message SyncMessage {
  oneof msg {
    ManifestRequest manifest_request = 1;
    ManifestResponse manifest_response = 2;
    PossessionBitfield possession = 3;
    ChunkRequest chunk_request = 4;
    ChunkData chunk_data = 5;
    BulkData bulk_data = 6;
  }
}

message ManifestRequest {
  string artifact_id = 1;
  optional uint64 version = 2; // if absent, latest
}

message ManifestResponse {
  string artifact_id = 1;
  uint64 version = 2;
  bytes root_hash = 3;
  uint64 total_size = 4;
  uint32 chunk_count = 5;
  uint32 chunk_size = 6;
  // Ordered leaf hashes so client can build its bitfield
  repeated bytes chunk_hashes = 7;
  repeated FileEntry entries = 8;
  ChunkAlgorithmProfile chunk_algorithm = 9;
  repeated uint32 chunk_sizes = 10;
  // V1 publisher-attestation tuple. Both fields are populated together for a
  // signed revision and both are empty only in explicit insecure mode.
  bytes publisher_public_key = 11;
  bytes publisher_signature = 12;
}

message ChunkAlgorithmProfile {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    FIXED_ALIGNED = 1;
    FAST_CDC = 2;
    BLOCK_ALIGNED_FAST_CDC = 3;
    ARCHIVE_AWARE_FAST_CDC = 4;
  }

  Kind kind = 1;
  uint32 profile_version = 2;
  uint32 nominal_chunk_size = 3;
  uint32 min_size = 4;
  uint32 avg_size = 5;
  uint32 max_size = 6;
  uint32 alignment = 7;
  uint32 header_size = 8;
  uint32 normalization_level = 9;
  uint32 zero_run_cutoff = 10;
  uint32 record_size = 11;
  uint64 seed = 12;
}

message FileEntry {
  string relative_path = 1;
  uint64 size = 2;
  uint32 chunk_start = 3;
  uint32 chunk_end = 4;
}

message PossessionBitfield {
  bytes bitfield = 1; // serialized Bitfield (4-byte count LE + packed bits)
}

message ChunkRequest {
  repeated uint32 indices = 1;
}

message ChunkData {
  uint32 chunk_index = 1;
  bytes data = 2;
  PayloadCompression compression = 3;
  uint32 uncompressed_size = 4;
}

// Bulk fast-path: concatenated chunks with minimal framing (Step 7)
message BulkData {
  bytes data = 1;
  uint32 start_index = 2;
  uint32 count = 3;
  PayloadCompression compression = 4;
  uint32 uncompressed_size = 5;
}

message ClientKeepAlive {}

message ServerMetadata {
  bytes serialized = 1;    // yet to be defined
  optional bytes uuid = 2; // Returned only on client registration
}

message ClientRegister {
  string name = 1;
  string version = 2;
  optional bytes uuid = 3;
  optional string enrollment_token = 4;
}
