[fsstorage]
enabled = true
root = "here"

[server]
url = "quic://localhost:50051"
enrollment_token = "replace-with-a-secret-enrollment-token"
certificate_fingerprint = "replace-with-the-server-certificate-blake3-fingerprint"
allow_tofu = false
publisher_public_keys = ["replace-with-a-64-character-lowercase-hex-ed25519-public-key"]

[log]
level = "DEBUG"

[client]
name = ""
# Backward-compatible name: caps missing payload admitted for transfer and
# temporary disk staging; payload is streamed through bounded memory buffers.
max_sync_memory_mib = 512
sync = [
  "ok"
]
