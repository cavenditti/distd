[package]
name = "distd_bench"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Benchmark suite comparing distd transfer performance against rsync, zsync, casync, and ostree"

[lints]
workspace = true

[[bin]]
name = "distd-bench"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
blake3 = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Process / metrics
libc = "0.2"
sysinfo = "0.32"
csv = "1.3"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
comfy-table = "7.2.2"
flate2 = "1.1"
zstd = "0.13"
